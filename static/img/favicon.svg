<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Angle brackets around a point: an inner product ⟨x, y⟩ and a template
       argument list, drawn as one mark. Ink on paper, no other colour. -->
  <style>
    .ground { fill: #fcfcfa; }
    .ink { fill: none; stroke: #17171a; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }
    .dot { fill: #17171a; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #121214; }
      .ink { stroke: #e6e3dd; }
      .dot { fill: #e6e3dd; }
    }
  </style>
  <rect class="ground" x="0" y="0" width="32" height="32" />
  <path class="ink" d="M13 6 L6 16 L13 26" />
  <path class="ink" d="M19 6 L26 16 L19 26" />
  <circle class="dot" cx="16" cy="16" r="1.9" />
</svg>
